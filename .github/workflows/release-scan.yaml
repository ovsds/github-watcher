name: 🔒 Security Scan

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: 0 0 * * 0
  workflow_dispatch:

concurrency:
  group: $${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: $/.github/actions/setup_environment

      - name: Get latest image tag
        id: get_tag
        uses: pozetroninc/github-action-get-latest-release@2a61c339ea7ef0a336d1daa35ef0cb1418e7676c # v0.8.0
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          excludes: prerelease, draft

      - name: Scan image for vulnerabilities
        id: scan
        uses: ovsds/run-with-output-action@9bc0dcb1df5b70d1704c709f9cc0f40d260a5f40 # v1.4.0
        continue-on-error: true
        with:
          run: |
            IMAGE_REGISTRY="ghcr.io/${{ github.repository_owner }}" \
            IMAGE_NAME="${{ github.event.repository.name }}" \
            IMAGE_TAG="${{ steps.get_tag.outputs.release }}" \
            mise run ci-image-scan

      - name: Report vulnerabilities
        uses: ovsds/create-or-update-unique-issue-action@8999e391f74f20449dcc70e94aee731a3938d543 # v1.1.0
        with:
          title: "Security scan issues for ${{ steps.get_tag.outputs.release }}"
          body: |
            ## Vulnerabilities found
            ```
            ${{ steps.scan.outputs.stdout }}
            ```
          unique-title-includes: "Security scan issues for "
          close: ${{ steps.scan.outputs.exit_code == 0 }}
